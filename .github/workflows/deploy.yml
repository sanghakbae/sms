name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # 저장소 Settings → Secrets and variables → Actions → Variables 에 등록
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_COLLECTION_PREFIX: ${{ vars.VITE_COLLECTION_PREFIX }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # 보안 규칙은 파일만 고쳐선 적용되지 않는다. 사람이 기억해서 CLI 를 돌리는 대신
  # 여기서 배포한다 — main 에 있는 규칙이 곧 서버에 걸린 규칙이 되도록.
  #
  # 앱보다 먼저 배포한다. 규칙이 늦으면 새 화면이 나간 뒤에도 데이터가 거부된다.
  # 이 잡이 실패하면 앱 배포도 멈춘다(두 쪽이 어긋난 채 나가는 것보다 낫다).
  rules:
    name: Firestore 보안 규칙 배포
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 규칙이 이번 푸시에서 바뀌었는지 본다.
      # 안 바뀌었으면 시크릿이 없어도 배포를 막지 않는다 — 무관한 변경까지
      # 통째로 멈추는 건 과하다. 바뀌었는데 못 올리는 경우만 실패시킨다.
      - id: changed
        run: |
          if git rev-parse HEAD^ >/dev/null 2>&1 \
             && git diff --quiet HEAD^ HEAD -- firestore.rules firestore.indexes.json; then
            echo "value=false" >> "$GITHUB_OUTPUT"
          else
            echo "value=true" >> "$GITHUB_OUTPUT"
          fi

      - id: creds
        name: 서비스 계정 자격증명 준비
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          RULES_CHANGED: ${{ steps.changed.outputs.value }}
        run: |
          if [ -n "$SA" ]; then
            printf '%s' "$SA" > "$RUNNER_TEMP/firebase-sa.json"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$RULES_CHANGED" = "true" ]; then
            echo "::error::firestore.rules 가 바뀌었는데 FIREBASE_SERVICE_ACCOUNT 시크릿이 없습니다." \
                 "규칙을 못 올리면 화면과 권한이 어긋납니다." \
                 "Settings → Secrets and variables → Actions → Secrets 에 등록하세요."
            exit 1
          fi
          echo "::warning::FIREBASE_SERVICE_ACCOUNT 시크릿이 없어 규칙 배포를 건너뜁니다." \
               "이번 푸시에는 규칙 변경이 없어 그대로 진행합니다."
          echo "ready=false" >> "$GITHUB_OUTPUT"

      - name: 규칙·인덱스 배포
        if: steps.creds.outputs.ready == 'true'
        run: |
          npx -y firebase-tools@14 deploy \
            --only firestore:rules,firestore:indexes \
            --project "${{ vars.VITE_FIREBASE_PROJECT_ID }}" \
            --non-interactive
      - name: 자격증명 삭제
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-sa.json"

  deploy:
    needs: [build, rules]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
